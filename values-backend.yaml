# Default values for mychart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


replicaCount: 1

image:
  repository: ghcr.io/sonamsamdupkhangsar/email-rest-service
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: github-regcred
nameOverride: ""
fullnameOverride: "email-rest-service"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

rbac:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - services
        - endpoints
      verbs:
        - get
        - list
        - watch

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
#  type: NodePort
  port: 80
  targetPort: 8080

istio:
  enabled: false

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 300m
    memory: 512Mi

#nodeSelector:
#  node.kubernetes.io/instance-type: s-2vcpu-4gb

tolerations: []

affinity: {}

envs:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25"
  - name: ISSUER_URI
    value: https://platform.openissuer.com/issuer
  - name: JWT_SET_URI
    value: https://platform.openissuer.com/issuer/oauth2/jwks
  - name: OAUTH_AUDIENCES
    value: oauth-client
  - name: NEW_RELIC_ENABLED
    value: false
  - name: AUTH_SERVER_ROOT
    value: "http://authorization-server.{{ .Release.Namespace }}.svc.cluster.local"

health:
  startup:
    path: /emails/api/health/liveness
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
  liveness:
    path: /emails/api/health/liveness
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 5
    timeoutSeconds: 5
  readiness:
    path: /emails/api/health/readiness
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 5
    timeoutSeconds: 5

secretFiles:
  - file: email-rest-service
    keys:
      - key: host
        name: EMAIL_HOST
      - key: port
        name: EMAIL_PORT
      - key: username
        name: EMAIL_USERNAME
      - key: password
        name: EMAIL_PASSWORD
